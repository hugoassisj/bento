# CI, dash: this zone's own jobs — validate, never release (see ci.yml's header).
#
# These jobs are NOT the required check. Only `validate` (ci.yml) gates a
# merge; a job here reports beside it, exactly as it did when it lived in
# ci.yml. Keep each job's id unchanged — the id IS the check name.
#
# Each job checks out and builds what it needs for itself. Add this zone's
# new jobs here, at the end; never in ci.yml.

name: CI (dash)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # The same rule as ci.yml, whose comment explains it: PR runs collapse onto
  # the tip, every commit on main keeps its own run.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Every step fails if a rig in it reports a skip CI does not allow
    # (scripts/lib/ci-skips.mjs). No job here sets a working-directory, which
    # this relative path relies on.
    shell: bash scripts/ci/bento-step {0}

jobs:
  dash-fields-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix dash
          npm run build:single --prefix dash
      - name: Every dash field wears the suite's one field look
        # Slides' rig, ported: every text field, select and textarea on 17
        # surfaces, light and dark, has the 1px --line border, --field fill,
        # 6px radius and 26px height, and the --accent-ink focus ring; each
        # surface must show fields in its own container, and a planted
        # browser-dressed field must be flagged.
        run: node scripts/test-dash-fields-browser.mjs

  dash-gate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        # Pinned outside app packages: browser automation is not shipped in documents.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the tested standalone document
        run: |
          npm ci --prefix dash
          npm run build:single --prefix dash
      - name: An encrypted or unopenable dash file opens to its gate
        # window.bento = { format, locked: true } before the password gate and
        # the refusal page, so the shell's loader counts the app as mounted
        # instead of re-running it and failing over the gate; unlocking
        # replaces it with the real workbook.
        run: node scripts/test-dash-gate-browser.mjs
