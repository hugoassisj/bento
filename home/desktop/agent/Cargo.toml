[package]
name = "bento-id-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "bento/id agent core for the desktop host (Windows, Linux): the signed statements, key storage and the agent contract"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7", optional = true }

[features]
# the Linux TPM key store (needs libtss2)
tpm = ["dep:tss-esapi"]
# the in-memory software key store: tests and rigs only, never a shipped path
test-store = []

[dev-dependencies]
serde_json = "1"
